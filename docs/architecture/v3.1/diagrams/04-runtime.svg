<path class="e" d="M645 794 L645 845"/>
<path fill="#627a9a" d="M645 845 L650 834 L640 834 Z"/>
<text x="40" y="1001" class="l">只有“建了工作”或“已登记后继”会进入调度；仅记录事实、禁用、旧代际等分支到此为止。</text>
<text x="241" y="655" class="l">成功创建</text>
<text x="660" y="655" class="l">有待做工作</text>
<text x="1078" y="655" class="l">仅在已触发时</text>
<text x="662" y="825" class="l">若进程重启</text>
</svg>
