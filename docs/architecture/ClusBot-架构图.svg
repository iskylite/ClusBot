<text x="56" y="1090" class="note">回路：验收/纠正 → 经验候选 → 评测+重放 → Skill 版本；经验与 Skill 存于「数据·知识层」，评测调用「执行层·模型」，成品 Skill 回填「内核」上下文。</text></svg>