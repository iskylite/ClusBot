<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">ClusBot V3.1｜从入口到下一步</title><desc id="desc">运行时收到记录，不代表立刻执行；先确认它是在建新任务、续旧任务，还是只更新事实。</desc>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18243b}.h{font-size:39px;font-weight:700}.s{font-size:20px;fill:#52647b}.t{font-size:23px;font-weight:700}.b{font-size:18px;fill:#405372}.l{font-size:17px;fill:#405372}.e{fill:none;stroke:#627a9a;stroke-width:2.6;stroke-linejoin:round}.d{stroke-dasharray:6 5}</style>
<rect width="1200" height="830" fill="#f7f9fc"/>
<text x="40" y="62" class="h">ClusBot V3.1｜从入口到下一步</text><text x="40" y="96" class="s">运行时收到记录，不代表立刻执行；先确认它是在建新任务、续旧任务，还是只更新事实。</text>
<rect x="40" y="132" width="1120" height="112" rx="16" fill="#e8f0ff"/>
<text x="58" y="167" class="t">对话：查询、委托、确认与跟进</text>
<text x="58" y="197" class="b">Go 按登录身份读取状态；内置工具的写操作先确认，再复核权限、版本和状态。</text>
<text x="58" y="224" class="b">模型可解释意图并提出候选；A2UI 1.0 显示结果，确认使用固定控件，外部能力经 MCP 等适配器接入。</text>
<rect x="40" y="284" width="340" height="100" rx="16" fill="#def5ec"/>
<text x="58" y="319" class="t">① 周期计划到期</text>
<text x="58" y="349" class="b">例如：今天 09:00 的发现计划</text>
<rect x="430" y="284" width="340" height="100" rx="16" fill="#def5ec"/>
<text x="448" y="319" class="t">② 原任务回执或到期</text>
<text x="448" y="349" class="b">例如：J17 完成 / T42 等超时</text>
<rect x="820" y="284" width="340" height="100" rx="16" fill="#def5ec"/>
<text x="838" y="319" class="t">③ 外部观测</text>
<text x="838" y="349" class="b">例如：发现工具上报新机器</text>
<rect x="40" y="425" width="340" height="110" rx="16" fill="#eaf0f7"/>
<text x="58" y="460" class="t">Go：按计划建新任务</text>
<text x="58" y="490" class="b">查启用状态、范围和授权</text>
<text x="58" y="515" class="b">同一次触发只开一件</text>
<rect x="430" y="425" width="340" height="110" rx="16" fill="#eaf0f7"/>
<text x="448" y="460" class="t">Go：匹配已有任务</text>
<text x="448" y="490" class="b">核对作业和当前等待；续 T42</text>
<text x="448" y="515" class="b">等超时则查证，不自动重跑</text>
<rect x="820" y="425" width="340" height="110" rx="16" fill="#eaf0f7"/>
<text x="838" y="460" class="t">领域服务：先保存事实</text>
<text x="838" y="490" class="b">去重、识别资产或保留候选</text>
<text x="838" y="515" class="b">有触发设置且获授权才建任务</text>
<rect x="40" y="590" width="1120" height="103" rx="16" fill="#def5ec"/>
<text x="58" y="625" class="t">Go 工作运行时：持久推进与执行准入</text>
<text x="58" y="655" class="b">任务、步骤、操作和等待由 Go 记账。派发前检查有效授权、资产状态与资源占用。</text>
<rect x="40" y="731" width="340" height="72" rx="16" fill="#def5ec"/>
<text x="58" y="766" class="t">适配器：CLI / HTTP / MCP</text>
<rect x="430" y="731" width="340" height="72" rx="16" fill="#eeeafd"/>
<text x="448" y="766" class="t">上下文：按权限取材料</text>
<rect x="820" y="731" width="340" height="72" rx="16" fill="#e8f0ff"/>
<text x="838" y="766" class="t">Worker：按需分析与报告</text>
