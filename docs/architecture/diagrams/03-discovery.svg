<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 722" width="1200" height="722" role="img" aria-labelledby="t d"><title id="t">新服务器发现｜先确认是谁，再决定做什么</title><desc id="d">定时触发不用 AI；AI 可以解释资料缺口，不能补造身份、事实与授权。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#627a9a"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18243b}.heading{font-size:39px;font-weight:700}.subtitle{font-size:19px;fill:#52647b}.name{font-size:23px;font-weight:700}.body{font-size:18px;fill:#425373}.foot{font-size:17px;fill:#405679}.edge{fill:none;stroke:#627a9a;stroke-width:2.3}</style><rect width="1200" height="722" fill="#f7f9fc"/><text x="40" y="60" class="heading">新服务器发现｜先确认是谁，再决定做什么</text><text x="40" y="94" class="subtitle">定时触发不用 AI；AI 可以解释资料缺口，不能补造身份、事实与授权。</text><rect x="40" y="133" width="338" height="113" rx="16" fill="#def5ec"/><text x="58" y="167" class="name">① 配置与定时触发</text><text x="58" y="197" class="body">人选可信只读范围与频率</text><text x="58" y="222" class="body">Go 持久化本次触发，重复去重</text><rect x="431" y="133" width="338" height="113" rx="16" fill="#def5ec"/><text x="449" y="167" class="name">② 只读工具上报</text><text x="449" y="197" class="body">记录可信来源、身份与 IP</text><text x="449" y="222" class="body">形成候选，不发安装任务</text><rect x="822" y="133" width="338" height="113" rx="16" fill="#def5ec"/><text x="840" y="167" class="name">③ 归一资产身份</text><text x="840" y="197" class="body">同一稳定身份换 IP → 更新</text><text x="840" y="222" class="body">只有 IP 或身份冲突 → 待复核</text><rect x="330" y="321" width="540" height="120" rx="16" fill="#def5ec"/><text x="348" y="355" class="name">④ 纳管前核对信息和权限</text><text x="348" y="385" class="body">身份、位置/归属、负责人、可信管理来源</text><text x="348" y="410" class="body">以及拟做动作所需的有效授权和实际状态</text><text x="207" y="476" class="foot">有缺口或无授权</text><text x="819" y="476" class="foot">核实且有授权</text><rect x="40" y="521" width="525" height="124" rx="16" fill="#fff0de"/><text x="58" y="555" class="name">暂不自动推进</text><text x="58" y="585" class="body">保留候选或已知状态，列出缺资料的项目</text><text x="58" y="610" class="body">AI 可帮查，不编造；由可信来源或负责人补齐</text><rect x="635" y="521" width="525" height="124" rx="16" fill="#def5ec"/><text x="653" y="555" class="name">⑤ 记录纳管 → 有限工作</text><text x="653" y="585" class="body">一次纳管事件可触发只读入场检查</text><text x="653" y="610" class="body">安装、重启、跑基准仍各自检查准入</text><text x="40" y="690" class="foot">未探测到机器不等于退役；发现权限不等于接管或执行权限。</text><path class="edge" d="M378 186 H431"/><path fill="#627a9a" d="M431 186 L420 181 L420 191 Z"/><path class="edge" d="M769 186 H822"/><path fill="#627a9a" d="M822 186 L811 181 L811 191 Z"/><path class="edge" d="M990 246 V291 H600 V321"/><path fill="#627a9a" d="M600 321 L605 310 L595 310 Z"/><path class="edge" d="M430 441 V483 H302 V521"/><path fill="#627a9a" d="M302 521 L307 510 L297 510 Z"/><path class="edge" d="M769 441 V483 H903 V521"/><path fill="#627a9a" d="M903 521 L908 510 L898 510 Z"/></svg>
