<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 745" width="1200" height="745" role="img" aria-labelledby="t d"><title id="t">POD7｜从一句话到可核实的报告</title><desc id="d">示例：DeepEP 40 卡、SM=60；过程不以模型自报完成作为验收。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10 Z" fill="#627a9a"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18243b}.heading{font-size:39px;font-weight:700}.subtitle{font-size:19px;fill:#52647b}.name{font-size:23px;font-weight:700}.body{font-size:18px;fill:#425373}.foot{font-size:17px;fill:#405679}.edge{fill:none;stroke:#627a9a;stroke-width:2.3}</style><rect width="1200" height="745" fill="#f7f9fc"/><text x="40" y="60" class="heading">POD7｜从一句话到可核实的报告</text><text x="40" y="94" class="subtitle">示例：DeepEP 40 卡、SM=60；过程不以模型自报完成作为验收。</text><rect x="40" y="135" width="338" height="113" rx="16" fill="#e8f0ff"/><text x="58" y="169" class="name">① 接单：Router</text><text x="58" y="199" class="body">理解“全套”和 DeepEP 参数</text><text x="58" y="224" class="body">按需请 Worker 读 Skill 补草案</text><rect x="431" y="135" width="338" height="113" rx="16" fill="#def5ec"/><text x="449" y="169" class="name">② 写入任务：Go</text><text x="449" y="199" class="body">查 POD7 范围、授权和方案</text><text x="449" y="224" class="body">冻结 T42 的步骤与验收依据</text><rect x="822" y="135" width="338" height="113" rx="16" fill="#def5ec"/><text x="840" y="169" class="name">③ 按绑定提交</text><text x="840" y="199" class="body">登记 O9，再调用测试服务</text><text x="840" y="224" class="body">收到 J17 → 关联本次执行</text><rect x="822" y="306" width="338" height="124" rx="16" fill="#def5ec"/><text x="840" y="340" class="name">④ 可信作业回程</text><text x="840" y="370" class="body">回执或主动查询同一服务</text><text x="840" y="395" class="body">核对 J17 与当前执行代际</text><rect x="431" y="306" width="338" height="124" rx="16" fill="#def5ec"/><text x="449" y="340" class="name">⑤ Go 核验产物</text><text x="449" y="370" class="body">检查作业产物、实测配置</text><text x="449" y="395" class="body">核对必测项；阈值另行判断</text><rect x="40" y="306" width="338" height="124" rx="16" fill="#e8f0ff"/><text x="58" y="340" class="name">⑥ AI 组织交付</text><text x="58" y="370" class="body">引用已核实数据，说明缺项</text><text x="58" y="395" class="body">区分跑齐、达标与资产验收</text><rect x="822" y="491" width="338" height="120" rx="16" fill="#fff0de"/><text x="840" y="525" class="name">提交应答丢失</text><text x="840" y="555" class="body">按 O9 找原作业；找不到就</text><text x="840" y="580" class="body">待核实，不立即重发</text><rect x="431" y="491" width="338" height="120" rx="16" fill="#fff0de"/><text x="449" y="525" class="name">证据缺失或无法核对</text><text x="449" y="555" class="body">指标已收；所需原始证据缺失</text><text x="449" y="580" class="body">标待补/待核实，不写已跑齐</text><rect x="40" y="491" width="338" height="120" rx="16" fill="#eeeafd"/><text x="58" y="525" class="name">报告拿什么作参考</text><text x="58" y="555" class="body">历史成绩查可比作业证据</text><text x="58" y="580" class="body">偏好只影响报告怎么写</text><text x="40" y="665" class="foot">步骤 ②–⑤ 的确定性核对不依赖 AI；网络超时或退出码 0 都不是业务验收。</text><path class="edge" d="M378 188 H431"/><path fill="#627a9a" d="M431 188 L420 183 L420 193 Z"/><path class="edge" d="M769 188 H822"/><path fill="#627a9a" d="M822 188 L811 183 L811 193 Z"/><path class="edge" d="M990 248 V306"/><path fill="#627a9a" d="M990 306 L995 295 L985 295 Z"/><path class="edge" d="M822 369 H769"/><path fill="#627a9a" d="M769 369 L780 374 L780 364 Z"/><path class="edge" d="M431 369 H378"/><path fill="#627a9a" d="M378 369 L389 374 L389 364 Z"/><path class="edge" d="M1160 205 H1178 V548 H1160"/><path fill="#627a9a" d="M1160 548 L1171 553 L1171 543 Z"/><path class="edge" d="M600 430 V491"/><path fill="#627a9a" d="M600 491 L605 480 L595 480 Z"/><path class="edge" d="M209 491 V430"/><path fill="#627a9a" d="M209 430 L204 441 L214 441 Z"/></svg>
