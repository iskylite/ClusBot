server:
  mode: loopback
  listen: 127.0.0.1:8080
  # 使用公共 HTTPS 反向代理时，改为 mode: server 并填写：
  # origin: https://clusbot.example.com
data_dir: ../data/accounts
model:
  provider: chat_completions
  base_url: https://api.openai.com/v1
  model_id: ""
  api_key_ref: env:CLUSBOT_MODEL_API_KEY
runtime:
  max_active_runs: 2
  max_run_seconds: 600
  model_timeout_seconds: 120
  max_output_tokens: 4096
  max_model_request_bytes: 524288
